---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
    yamllint .
    ansible-lint
    flake8
platforms:
  - name: postgresql14
    platform: linux/arm64
    image: rockylinux/rockylinux:9
    pre_build_image: true

  - name: postgresql15
    platform: linux/arm64
    pre_build_image: true
    image: rockylinux/rockylinux:9

  - name: postgresql16
    platform: linux/arm64
    image: rockylinux/rockylinux:9
    pre_build_image: true

  - name: postgresql17
    platform: linux/arm64
    image: rockylinux/rockylinux:9
    pre_build_image: true

  - name: postgresql18
    platform: linux/arm64
    image: rockylinux/rockylinux:9
    pre_build_image: true

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp/.ansible/tmp
  lint:
    name: ansible-lint
  inventory:
    host_vars:
      postgresql_exact:
      postgresql14:
        postgresql_version: "14"
      postgresql15:
        postgresql_version: "15"
      postgresql16:
        postgresql_version: "16"
      postgresql17:
        postgresql_version: "17"
      postgresql18:
        postgresql_version: "18"
  playbooks:
    converge: ../resources/playbook.yml
scenario:
  name: rockylinux9
verifier:
  name: testinfra
  directory: ../resources/tests/
