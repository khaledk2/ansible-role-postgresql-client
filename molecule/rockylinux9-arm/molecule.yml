---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
    yamllint .
    ansible-lint
    flake8
platforms:
  - name: postgresql14-arm
    platform: linux/arm64
    image: geerlingguy/docker-rockylinux9-ansible:latest
  - name: postgresql15-arm
    platform: linux/arm64
    image: geerlingguy/docker-rockylinux9-ansible:latest
  - name: postgresql16-arm
    platform: linux/arm64
    image: geerlingguy/docker-rockylinux9-ansible:latest
  - name: postgresql17-arm
    platform: linux/arm64
    image: geerlingguy/docker-rockylinux9-ansible:latest
  - name: postgresql18-arm
    platform: linux/arm64
    image: geerlingguy/docker-rockylinux9-ansible:latest
provisioner:
  name: ansible
  lint:
    name: ansible-lint
  inventory:
    host_vars:
      postgresql_exact:
      postgresql14-arm:
        postgresql_version: "14"
      postgresql15-arm:
        postgresql_version: "15"
      postgresql16-arm:
        postgresql_version: "16"
      postgresql17-arm:
        postgresql_version: "17"
      postgresql18-arm:
        postgresql_version: "18"
  playbooks:
    converge: ../resources/playbook.yml
scenario:
  name: rockylinux9
verifier:
  name: testinfra
  directory: ../resources/tests/
